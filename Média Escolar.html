<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Média Escolar</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container{
      background: white;
      padding: 30px;
      width: 400px;
      border-radius: 12px;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
    }

    h1{
      text-align: center;
      margin-bottom: 20px;
      color: #ff7b00;
    }

    input{
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button{
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #ff7b00;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover{
      background: #e66d00;
    }

    #resultado{
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      display: none;
    }

    .aprovado{
      background: #dbeafe;
      color: #1d4ed8;
    }

    .exame{
      background: #dcfce7;
      color: #166534;
    }

    .reprovado{
      background: #fee2e2;
      color: #b91c1c;
    }

  </style>
</head>
<body>

  <div class="container">

    <h1>Média Escolar</h1>

    <input type="text" id="nome" placeholder="Nome do aluno">

    <input type="number" id="nota1" placeholder="Nota 1">

    <input type="number" id="nota2" placeholder="Nota 2">

    <input type="number" id="nota3" placeholder="Nota 3">

    <button id="btnCalcular">Calcular Média</button>

    <div id="resultado"></div>

  </div>

  <script>

    const botao = document.getElementById("btnCalcular");

    botao.addEventListener("click", function(){

      let nome = document.getElementById("nome").value;

      let nota1 = Number(document.getElementById("nota1").value);
      let nota2 = Number(document.getElementById("nota2").value);
      let nota3 = Number(document.getElementById("nota3").value);

      let resultado = document.getElementById("resultado");

      if(
        nota1 > 10 || nota2 > 10 || nota3 > 10 ||
        nota1 < 0 || nota2 < 0 || nota3 < 0
      ){

        resultado.style.display = "block";

        resultado.className = "reprovado";

        resultado.innerHTML =
        "As notas devem estar entre 0 e 10.";

        return;
      }

      let media = (nota1 + nota2 + nota3) / 3;

      resultado.style.display = "block";

      resultado.classList.remove("aprovado");
      resultado.classList.remove("exame");
      resultado.classList.remove("reprovado");

      if(media >= 7 && media <= 10){

        resultado.classList.add("aprovado");

        resultado.innerHTML =
        "Aluno: " + nome + "<br>" +
        "Situação: APROVADO<br>" +
        "Média: " + media.toFixed(2);

      }

      else if(media >= 4 && media < 7){

        let falta = 10 - media;

        resultado.classList.add("exame");

        resultado.innerHTML =
        "Aluno: " + nome + "<br>" +
        "Situação: EXAME<br>" +
        "Média: " + media.toFixed(2) + "<br>" +
        "Faltam " + falta.toFixed(2) + " pontos para chegar em 10.";

      }

      else{

        resultado.classList.add("reprovado");

        resultado.innerHTML =
        "Aluno: " + nome + "<br>" +
        "Situação: REPROVADO<br>" +
        "Média: " + media.toFixed(2);

      }

    });

  </script>

</body>
</html>
