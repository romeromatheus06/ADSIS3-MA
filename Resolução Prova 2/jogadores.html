<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogadores</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body, html {
    height: 100%;
    margin: 0;
}
.bg-copa {
    background-image: url('img/FIFA-World-Cup-26.jpg');
    background-size: cover;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.card {
    background: rgba(255,255,255,0.9);
}
</style>
</head>
<body>

<div class="bg-copa">

<div id="Cards" class="d-flex gap-3">

<div id="vini" class="card" style="width:22rem; display:none;">
    <img src="img/_vinicius_junior.png" class="card-img-top">
    <div class="card-body">
        <h5>Vini Jr <span class="badge bg-secondary">9.5</span></h5>
        <p>Nascimento: 12/07/2000<br>Altura: 1.76<br>Posição: Atacante</p>
    </div>
</div>

</div>

<button onclick="mostrarVini()" class="btn btn-warning">Revelar Vini Jr</button>
<button onclick="add()" class="btn btn-success">Adicionar Paquetá</button>

</div>

<script>
let adicionado = false;

function mostrarVini(){
    document.getElementById('vini').style.display = 'block';
}

function add(){
    if(adicionado){
        alert("Paquetá já foi adicionado!");
        return;
    }

    const container = document.getElementById('Cards');

    const card = document.createElement('div');
    card.className = 'card';
    card.style.width = '22rem';

    card.innerHTML = `
        <img src="img/Lucas_Paqueta.webp" class="card-img-top">
        <div class="card-body">
            <h5>Lucas Paquetá <span class="badge bg-secondary">8.8</span></h5>
            <p>Nascimento: 27/08/1997<br>Altura: 1.80<br>Posição: Meio-campista</p>
        </div>
    `;

    container.appendChild(card);
    adicionado = true;
}
</script>

</body>
</html>
