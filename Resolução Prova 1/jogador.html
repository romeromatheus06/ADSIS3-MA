<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Jogador</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
    }

    .bg-copa {
      background-image: url('FIFA-World-Cup-26.jpg');
      background-size: cover;
      background-position: center;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
    }

    .card img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
    }

    .placeholder {
      color: gray;
    }
  </style>
</head>

<body>

<div class="bg-copa">
  <div>

    <div class="card">
      <img src="placeholder.png">

      <h3 id="Nome" class="placeholder">Nome</h3>
      <p id="Data_Nas" class="placeholder">Data</p>
      <p id="Altura" class="placeholder">Altura</p>
      <p id="Posicao" class="placeholder">Posição</p>
      <p id="Rank" class="placeholder">Rank</p>

    </div>

    <button onclick="revelar()">Revelar</button>

    <br><br>

    <a href="index.html">
      <button>Voltar</button>
    </a>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
